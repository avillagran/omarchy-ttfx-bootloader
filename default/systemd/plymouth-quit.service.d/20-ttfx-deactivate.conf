[Service]
# TTFX paints the final animation frame into fbcon before quitting, so a
# deactivate here drops DRM master immediately while console restore shows the
# splash's exact last pixels. Without it the retained initramfs plymouthd
# (init.scope, untracked by systemd) lingers holding DRM master and the
# display manager's compositor aborts in initServer until plymouthd dies.
ExecStartPre=/usr/bin/timeout -k 1s 3s /usr/bin/plymouth deactivate
