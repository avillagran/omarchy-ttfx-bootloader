# Plymouth needs real keyboards at startup: if no evdev keyboard exists when
# the first key arrives, the key goes to the VT console (echo on) and the
# resulting fbcon output flips Plymouth to the text details view. Omarchy puts
# plymouth right after udev; move the keyboard hook (synchronous input-driver
# load) before it. Evaluated after omarchy_hooks.conf replaces HOOKS.
_ttfx_hooks=()
_ttfx_inserted=0
for _ttfx_h in "${HOOKS[@]}"; do
  [[ $_ttfx_h == keyboard ]] && continue
  if [[ $_ttfx_h == plymouth && $_ttfx_inserted -eq 0 ]]; then
    _ttfx_hooks+=(keyboard)
    _ttfx_inserted=1
  fi
  _ttfx_hooks+=("$_ttfx_h")
done
(( _ttfx_inserted )) || _ttfx_hooks+=(keyboard)
HOOKS=("${_ttfx_hooks[@]}")
unset _ttfx_hooks _ttfx_h _ttfx_inserted
